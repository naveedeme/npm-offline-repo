name: Build NPM Offline Repository

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name, for example v1.2.0. Leave blank to auto-generate.'
        required: false
        default: ''
      node_version:
        description: 'Node.js version to use for the offline build'
        required: false
        default: '24.18.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ github.event.inputs.node_version || '24.18.0' }}

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.set-tag.outputs.tag }}
      is_versioned: ${{ steps.set-tag.outputs.is_versioned }}
    steps:
      - name: Set release tag
        id: set-tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            IS_VERSIONED="false"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            IS_VERSIONED="true"
          else
            TAG="v$(date -u +'%Y.%m.%d')-$(echo '${{ github.sha }}' | cut -c1-7)"
            IS_VERSIONED="false"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve release tag." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=${IS_VERSIONED}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (versioned=${IS_VERSIONED})"

  build-offline-repository:
    name: Build ${{ matrix.variant }}
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            variant: ubuntu-22.04
          - runner: ubuntu-24.04
            variant: ubuntu-24.04
          - runner: ubuntu-26.04
            variant: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show build environment
        shell: bash
        run: |
          node -v
          npm -v
          uname -a
          cat /etc/os-release

      - name: Install Verdaccio
        shell: bash
        run: npm install -g verdaccio@latest

      - name: Build registry, cache, lockfiles, and prebuilt modules
        shell: bash
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: bash scripts/build-offline-repository.sh

      - name: Verify offline install path
        shell: bash
        run: bash artifacts/offline-repository/verify-offline-repo.sh

      - name: Prepare variant release files
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp artifacts/npm-offline-repository.tar.gz "release-artifacts/npm-offline-repository-${{ matrix.variant }}.tar.gz"
          tar -czf "release-artifacts/node_modules_by_framework-${{ matrix.variant }}.tar.gz" \
            -C artifacts/offline-repository node_modules_by_framework
          (
            cd release-artifacts
            sha256sum "npm-offline-repository-${{ matrix.variant }}.tar.gz" \
              "node_modules_by_framework-${{ matrix.variant }}.tar.gz" \
              > "SHA256SUMS-${{ matrix.variant }}.txt"
          )

      - name: List variant artifacts
        shell: bash
        run: find release-artifacts -type f -exec du -h {} \; | sort -h

      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: release-artifacts/*
          retention-days: 1

  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs:
      - resolve-tag
      - build-offline-repository
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
      IS_VERSIONED: ${{ needs.resolve-tag.outputs.is_versioned }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download variant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "No commit message")
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          cat > release_notes.md <<EOF
          ## NPM Offline Repository ${TAG}

          Built on: ${BUILT_AT}
          Commit: \`${COMMIT_SHA}\`
          Node.js: \`${{ env.NODE_VERSION }}\`

          > ${COMMIT_MSG}

          ### Choose Your Ubuntu Variant

          Download the pair that matches the offline computer:

          | Offline OS | Repository bundle | Prebuilt modules bundle |
          |---|---|---|
          | Ubuntu 22.04 | \`npm-offline-repository-ubuntu-22.04.tar.gz\` | \`node_modules_by_framework-ubuntu-22.04.tar.gz\` |
          | Ubuntu 24.04 | \`npm-offline-repository-ubuntu-24.04.tar.gz\` | \`node_modules_by_framework-ubuntu-24.04.tar.gz\` |
          | Ubuntu 26.04 | \`npm-offline-repository-ubuntu-26.04.tar.gz\` | \`node_modules_by_framework-ubuntu-26.04.tar.gz\` |

          Each variant is built independently on its matching GitHub-hosted Ubuntu runner.

          ### Offline Usage

          \`\`\`bash
          tar -xzf npm-offline-repository-ubuntu-22.04.tar.gz
          tar -xzf node_modules_by_framework-ubuntu-22.04.tar.gz
          ./install-node-offline.sh
          source ./node-env.sh
          npm install -g verdaccio --offline --cache ./npm-cache
          ./start-offline-registry.sh
          ./install-from-offline-repo.sh react-vite /home/user/myapp
          \`\`\`

          Replace \`ubuntu-22.04\` with \`ubuntu-24.04\` or \`ubuntu-26.04\` when using those machines.

          ### Native Package Note

          The prebuilt \`node_modules\` tarballs are the safest option for packages with native binaries. If you run \`npm ci\` offline instead, keep Node.js, npm, Linux distribution, CPU architecture, and glibc compatible with the selected variant.
          EOF

      - name: Delete existing release if updating rolling release
        if: env.IS_VERSIONED == 'false'
        shell: bash
        run: |
          gh release delete "${{ env.RELEASE_TAG }}" --yes 2>/dev/null || true
          git push origin --delete "${{ env.RELEASE_TAG }}" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'NPM Offline Repository ${{ env.RELEASE_TAG }}'
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_VERSIONED == 'false' }}
          make_latest: ${{ env.IS_VERSIONED }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          echo "## Offline repository release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ env.RELEASE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r file; do
            size=$(du -h "$file" | cut -f1)
            echo "| \`$(basename "$file")\` | ${size} |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find release-artifacts -type f | sort)
